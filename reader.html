<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>BCBP Scanner • Scanbot (demarkera.github.io)</title>
  <style>
    html, body { margin:0; padding:0; height:100%; background:#0b0b0c; color:#eaeaea; font-family: system-ui, Segoe UI, Roboto, Arial, sans-serif; }
    header { padding:12px 16px; font-weight:700; }
    #scanner { width:100%; height: calc(100dvh - 280px); background:#111; }
    .panel { padding:12px 16px; border-top:1px solid #222; }
    .kv { display:grid; grid-template-columns: 140px 1fr; gap:6px 12px; }
    .kv b { color:#cfcfcf; }
    pre { white-space: pre-wrap; word-wrap: break-word; background:#121212; padding:8px; border-radius:8px; }
    .btns { padding:8px 16px 0 16px; display:flex; gap:8px; flex-wrap:wrap; }
    button { padding:10px 12px; border-radius:10px; border:1px solid #2a2a2a; background:#1d1d1f; color:#fff; }
  </style>
</head>
<body>
  <header>BCBP Mobile Scanner (Scanbot)</header>

  <div class="btns">
    <button id="initBtn">Init Scanbot SDK</button>
    <button id="startBtn" disabled>Start Scanner</button>
    <button id="stopBtn" disabled>Stop</button>
  </div>

  <div id="scanner"></div>

  <div class="panel">
    <h3>Diagnostics</h3>
    <div class="kv" id="diagKV"></div>
    <pre id="diagLog">(no logs yet)</pre>
  </div>

  <div class="panel">
    <h3>Raw decode</h3>
    <pre id="raw">(no scan yet)</pre>
  </div>

  <div class="panel">
    <h3>Parsed (Leg 1: primary block)</h3>
    <div class="kv" id="kv"></div>
  </div>

  <!-- Scanbot Web SDK (CDN). For production you can self-host the engine files. -->
  <script src="https://cdn.jsdelivr.net/npm/scanbot-web-sdk@latest/bundle/ScanbotSDK.min.js"></script>

  <script>
    // === Your Scanbot license key (origin-locked to https://demarkera.github.io) ===
    const LICENSE_KEY =
  "TeQKYjVexG+hy9NH0pmh/1EDrFS71e" +
  "SADkAXc1oNbgPksei2EZF/fAISvm10" +
  "UGMdgrRrph1yvqyLv8NTjndYxTU5od" +
  "o2GdLYNb2hF0x93CWCTvXmzqehOon6" +
  "U5puIXSTKSuXRfZs6jYAE24SsDmABZ" +
  "iVpw822LudGZVUdHsXBhvPKra6UFRX" +
  "qhIlc+tNOVEmWLaflaBpEN/70/iO4Y" +
  "yVbINhDjVv7+LPtR6dCk2luP8nYdx3" +
  "VMpwmYMd4Su49qUoDzsF/y9XkFm7GC" +
  "KH2sWkqTRGe6sc397eX6v9/t6xJyaq" +
  "dE2bW5FuWRPRUuFOCmASwZXWy+y3dZ" +
  "KxRwlAxVDjdA==\nU2NhbmJvdFNESw" +
  "psb2NhbGhvc3R8ZGVtYXJrZXJhLmdp" +
  "dGh1Yi5pbwoxNzU5ODgxNTk5CjgzOD" +
  "g2MDcKOA==\n";

    let scanbotSDK;  // SDK instance
    let scanner;     // Scanner instance

    const initBtn = document.getElementById('initBtn');
    const startBtn = document.getElementById('startBtn');
    const stopBtn  = document.getElementById('stopBtn');
    const rawOut   = document.getElementById('raw');
    const kv       = document.getElementById('kv');
    const diagKV   = document.getElementById('diagKV');
    const diagLog  = document.getElementById('diagLog');

    function log(msg) {
      diagLog.textContent += `${new Date().toISOString()}  ${msg}\n`;
    }
    function showKV(container, obj) {
      container.innerHTML = '';
      for (const [k,v] of Object.entries(obj)) {
        const kEl = document.createElement('div'); kEl.innerHTML = `<b>${k}</b>`;
        const vEl = document.createElement('div'); vEl.textContent = (v === null || v === undefined) ? '' : String(v);
        container.appendChild(kEl); container.appendChild(vEl);
      }
    }

    // Minimal primary-block parser for IATA BCBP (leg 1)
    function parseBCBPPrimary(raw) {
      if (!raw || raw.length < 60) return { error: "Not enough data to parse primary fields." };
      const fmt   = raw[0];
      const legs  = raw[1];
      const name  = raw.slice(2, 22).trim();
      const etkt  = raw[22];
      const pnr   = raw.slice(23, 30).trim();
      const from  = raw.slice(30, 33);
      const to    = raw.slice(33, 36);
      const mkt   = raw.slice(36, 39).trim();
      const flt   = raw.slice(39, 44).trim();
      const jDay  = raw.slice(44, 47);
      const cabin = raw[47];
      const seat  = raw.slice(48, 52).trim();
      const seq   = raw.slice(52, 57).trim();
      const stat  = raw[57];
      return { formatCode: fmt, numberOfLegs: legs, name, electronicTicket: etkt, pnr,
               from, to, marketingCarrier: mkt, flightNumber: flt, julianDate: jDay,
               cabin, seat, checkinSequence: seq, passengerStatus: stat };
    }

    async function initSDK() {
      if (scanbotSDK) return;

      if (!('WebAssembly' in window)) {
        log('WebAssembly not supported in this browser.');
        alert('WebAssembly is not supported. Update your browser/OS.');
        return;
      }

      try {
        // CDN is fine for GitHub Pages. For self-hosting, see note below.
        scanbotSDK = await ScanbotSDK.initialize({
          licenseKey: LICENSE_KEY,
          enginePath: "https://cdn.jsdelivr.net/npm/scanbot-web-sdk@latest/bundle/bin/complete/"
          // For self-hosting in your repo:
          // enginePath: "./scanbot/bin/complete/"  // (place the bin/complete folder inside your repo and commit it)
        });
        log('Scanbot SDK initialized.');
        const info = await scanbotSDK.getLicenseInfo();
        showKV(diagKV, {
          licenseValid: info.isLicenseValid,
          licenseStatus: info.status,
          licenseExpiry: info.expiryDate,
          pageOrigin: location.origin
        });
        if (!info.isLicenseValid) {
          log('License invalid for this origin. Verify the key matches https://demarkera.github.io.');
        }
        startBtn.disabled = true; // require a user gesture on iOS: press "Start Scanner"
        initBtn.disabled = true;
        startBtn.disabled = false;
      } catch (e) {
        log('SDK init failed: ' + (e && e.message ? e.message : e));
        alert('Scanbot SDK failed to initialize.\n\nCommon causes:\n• License not valid for this origin\n• Engine files blocked (CORS/MIME/CSP)\n• Non-HTTPS context');
      }
    }

    async function startScanner() {
      if (!scanbotSDK) return;
      startBtn.disabled = true;
      stopBtn.disabled = false;

      const detectionParameters = {
        barcodeFormatConfigurations: [
          new ScanbotSDK.Config.BarcodeFormatCommonConfiguration({
            formats: ["PDF_417", "AZTEC", "QR_CODE", "DATA_MATRIX"]
          })
        ]
      };

      const configuration = {
        containerId: 'scanner',
        captureDelay: 600,
        detectionParameters,
        preferredCamera: 'environment',
        showFinder: true,
        onBarcodesDetected: (result) => {
          if (!result?.barcodes?.length) return;
          const first = result.barcodes[0];
          rawOut.textContent = `${first.format}: ${first.text}`;
          showKV(kv, parseBCBPPrimary(first.text));

          // Samsung S24 fix: dispose after the callback returns
          setTimeout(() => {
            if (scanner) {
              scanner.dispose();
              scanner = null;
              log('Scanner disposed after first result.');
              startBtn.disabled = false;
              stopBtn.disabled = true;
            }
          }, 200);
        },
        onError: (e) => {
          log('Scanner error: ' + (e?.message || e));
        }
      };

      try {
        scanner = await scanbotSDK.createBarcodeScanner(configuration);
        log('Scanner started.');
      } catch (e) {
        log('Failed to create scanner: ' + (e?.message || e));
        startBtn.disabled = false;
        stopBtn.disabled = true;
      }
    }

    function stopScanner() {
      if (scanner) {
        scanner.dispose();
        scanner = null;
        log('Scanner stopped by user.');
      }
      stopBtn.disabled = true;
      startBtn.disabled = false;
    }

    initBtn.addEventListener('click', initSDK);
    startBtn.addEventListener('click', startScanner);
    stopBtn.addEventListener('click', stopScanner);
  </script>
</body>
</html>

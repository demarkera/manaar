<!DOCTYPE html>
<html>
<head>
  <title>Airport Coverage Map</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
  <style>
    #map { height: 600px; width: 100%; }
  </style>
</head>
<body>

<div id="map"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
  const map = L.map('map').setView([20, 0], 2);

  L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}.png', {
    attribution: '&copy; OpenStreetMap, CARTO'
  }).addTo(map);

  const airports = [
    { code: "GRU", coords: [-23.4356, -46.4731], name: "São Paulo–Guarulhos", lounges: 2, companies: ["LATAM", "UA"] },
    { code: "EWR", coords: [40.6895, -74.1745], name: "Newark Liberty", lounges: 5, companies: ["UA", "LH"] },
    { code: "LAX", coords: [33.9416, -118.4085], name: "Los Angeles Intl", lounges: 4, companies: ["UA", "DL"] },
    { code: "SEA", coords: [47.4502, -122.3088], name: "Seattle–Tacoma Intl", lounges: 3, companies: ["UA", "LH"] },
    { code: "ORD", coords: [41.9742, -87.9073], name: "Chicago O'Hare", lounges: 6, companies: ["UA", "LH"] },
    { code: "FRA", coords: [50.0379, 8.5622], name: "Frankfurt Airport", lounges: 7, companies: ["LH"] }
  ];

  airports.forEach(airport => {
    const marker = L.circleMarker(airport.coords, {
      radius: 10,
      color: "#007bff",
      fillColor: "#007bff",
      fillOpacity: 0.3
    }).addTo(map);

    marker.bindPopup(`
      <b>${airport.name}</b><br>
      Airport: ${airport.code}<br>
      Lounges: ${airport.lounges}<br>
      Companies: ${airport.companies.join(", ")}
    `);
  });
</script>

</body>
</html>
